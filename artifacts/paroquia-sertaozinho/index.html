<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Site oficial da Paróquia Nossa Senhora Aparecida de Sertãozinho - SP. Horários de missas, sacramentos, pastorais, capelas, eventos e muito mais." />
    <title>Paróquia Nossa Senhora Aparecida - Sertãozinho</title>
    <link rel="icon" type="image/webp" href="/logo.webp" />

    <!-- Preload hero/LCP image — stable public URL lets browser fetch before JS runs -->
    <link rel="preload" as="image" href="/hero-slide-1.jpg" fetchpriority="high">

    <!-- Fonts: <link> in HTML so browser discovers them in parallel with main CSS,
         removing the @import cascade delay (no FOIT — still render-blocking like before) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
