packages:
  "framer-motion": "For smooth scroll animations, navbar transitions, and dropdowns"
  "react-hook-form": "For the contact form state management"
  "@hookform/resolvers": "For Zod validation with react-hook-form"
  "clsx": "For conditional class merging"
  "tailwind-merge": "For merging tailwind classes safely"

images:
