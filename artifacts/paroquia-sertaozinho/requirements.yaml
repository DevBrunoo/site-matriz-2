    description: "Beautiful interior of a majestic traditional Catholic church with warm glowing light streaming through stained glass windows, dramatic atmosphere, high resolution"
    aspect_ratio: "16:9"
  - path: "artifacts/paroquia-sertaozinho/public/images/pattern-bg.png"
